[metadata]
name = voyage-skill
version = 0.1.0
description = Verifiable operating control for multi-agent software projects
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = deland

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    voyage = voyage_skill.cli:main
